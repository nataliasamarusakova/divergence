name: BingX Read-only API Diagnostics

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: 'Type READ_ONLY to run signed GET diagnostics (no trading actions)'
        required: true
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: bingx-readonly-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: ${{ inputs.confirm_read_only == 'READ_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BINGX_ENV: vst
      BINGX_BASE_URL: https://open-api-vst.bingx.com
      BINGX_HTTP_TIMEOUT_SEC: '8'
      BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
      BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate diagnostic credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BINGX_API_KEY"
          test -n "$BINGX_SECRET_KEY"

      - name: Run read-only BingX diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python bingx_readonly_diagnostic.py | tee bingx-readonly-diagnostic.json

      - name: Upload sanitized diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-readonly-diagnostic-${{ github.run_id }}
          path: bingx-readonly-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
