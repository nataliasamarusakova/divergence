name: VPN + Binance Connectivity Test

on:
  workflow_dispatch:

jobs:
  vpn-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Install WireGuard
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v wg >/dev/null 2>&1 || \
             ! command -v wg-quick >/dev/null 2>&1 || \
             ! command -v resolvconf >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y wireguard-tools resolvconf
          fi

      - name: Connect Proton WireGuard
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.WIREGUARD_CONF }}" \
            | sudo tee /etc/wireguard/wg0.conf >/dev/null

          sudo chmod 600 /etc/wireguard/wg0.conf

          sudo wg-quick up wg0

          echo "=== WireGuard ==="
          sudo wg show wg0

      - name: Show outbound IP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== OUTBOUND IP ==="
          curl -fsS --max-time 10 https://ipinfo.io/json

      - name: Test Binance Futures
        shell: bash
        run: |
          set -euo pipefail

          test_url() {
            local name="$1"
            local url="$2"

            echo
            echo "========== $name =========="
            echo "$url"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-time 15 \
              --write-out "\nHTTP_STATUS=%{http_code}\n" \
              "$url"
          }

          test_url \
            "BINANCE FUTURES PING" \
            "https://fapi.binance.com/fapi/v1/ping"

          test_url \
            "BINANCE FUTURES TIME" \
            "https://fapi.binance.com/fapi/v1/time"

          test_url \
            "BINANCE FUTURES EXCHANGE INFO" \
            "https://fapi.binance.com/fapi/v1/exchangeInfo"

          test_url \
            "BINANCE BTC 1H KLINES" \
            "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1h&limit=10"

          test_url \
            "BINANCE BTC PRICE" \
            "https://fapi.binance.com/fapi/v1/ticker/price?symbol=BTCUSDT"

      - name: Test Binance Spot Data API
        shell: bash
        run: |
          set -euo pipefail

          for url in \
            "https://data-api.binance.vision/api/v3/ping" \
            "https://data-api.binance.vision/api/v3/time" \
            "https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT" \
            "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=10"
          do
            echo
            echo "========== $url =========="
            curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              --write-out "\nHTTP_STATUS=%{http_code}\n" \
              "$url"
          done

      - name: Cleanup VPN
        if: always()
        shell: bash
        run: |
          sudo wg-quick down wg0 || true
