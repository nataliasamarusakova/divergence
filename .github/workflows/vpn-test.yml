name: VPN + Exchange API Deep Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vpn-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      BINANCE_BASE_URL: https://fapi.binance.com
      BINANCE_HTTP_PROXY: http://127.0.0.1:18080
      BINGX_BASE_URL: https://open-api-vst.bingx.com
      VPN_EXPECTED_COUNTRY: NL
      AUDIT_SYMBOLS_BINANCE: BTCUSDT,XRPUSDT,KAITOUSDT
      AUDIT_SYMBOLS_BINGX: BTC-USDT,XRP-USDT,KAITO-USDT

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Binance WireProxy
        env:
          WIREPROXY_VERSION: v1.1.3
          WIREPROXY_URL: https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          WIREPROXY_SHA256: e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cache/wireproxy"
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$CACHE_DIR" "$BIN_DIR"
          ARCHIVE="$CACHE_DIR/wireproxy_linux_amd64.tar.gz"
          if [ ! -s "$ARCHIVE" ] || [ "$(sha256sum "$ARCHIVE" | awk '{print $1}')" != "$WIREPROXY_SHA256" ]; then
            curl --fail --silent --show-error --location \
              "$WIREPROXY_URL" -o "$ARCHIVE"
          fi
          echo "$WIREPROXY_SHA256  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$CACHE_DIR"
          test -f "$CACHE_DIR/wireproxy"
          install -m 0755 "$CACHE_DIR/wireproxy" "$BIN_DIR/wireproxy"
          "$BIN_DIR/wireproxy" --version

      - name: Start Binance-only WireProxy
        env:
          WIREGUARD_CONF: ${{ secrets.WIREGUARD_CONF }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WIREGUARD_CONF:-}"
          VPN_DIR="$(mktemp -d)"
          echo "VPN_DIR=$VPN_DIR" >> "$GITHUB_ENV"
          WG_CONF="$VPN_DIR/wg.conf"
          PROXY_CONF="$VPN_DIR/wireproxy.conf"
          printf '%s\n' "$WIREGUARD_CONF" > "$WG_CONF"
          chmod 600 "$WG_CONF"
          cat > "$PROXY_CONF" <<EOF
          WGConfig = $WG_CONF

          [http]
          BindAddress = 127.0.0.1:18080
          EOF
          chmod 600 "$PROXY_CONF"
          "$HOME/.local/bin/wireproxy" --configtest -c "$PROXY_CONF"
          "$HOME/.local/bin/wireproxy" -c "$PROXY_CONF" >"$VPN_DIR/wireproxy.log" 2>&1 &
          echo $! > "$VPN_DIR/wireproxy.pid"

          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail --noproxy "" \
              --proxy "http://127.0.0.1:18080" \
              --connect-timeout 3 --max-time 8 \
              https://ipinfo.io/json -o "$VPN_DIR/proxy-ipinfo.json"; then
              break
            fi
            sleep 1
          done

          test -s "$VPN_DIR/proxy-ipinfo.json" || {
            echo 'ERROR: Binance WireProxy did not become usable' >&2
            cat "$VPN_DIR/wireproxy.log" >&2 || true
            exit 1
          }

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          vpn_dir = Path(os.environ["VPN_DIR"])
          data = json.loads((vpn_dir / "proxy-ipinfo.json").read_text())
          expected = os.environ["VPN_EXPECTED_COUNTRY"]
          actual = str(data.get("country", "")).upper()
          print(json.dumps({k: data.get(k) for k in ("ip", "country", "city", "org")}, indent=2))
          if expected and actual != expected.upper():
              raise SystemExit(f"VPN country mismatch: expected {expected}, got {actual}")
          PY

          echo '=== DIRECT EGRESS (NO PROXY) ==='
          curl --fail --silent --show-error --noproxy '*' --max-time 10 https://ipinfo.io/json
          echo

          if ip link show wg0 >/dev/null 2>&1; then
            echo 'ERROR: global wg0 interface exists; Binance VPN must remain userspace-only' >&2
            exit 1
          fi

      - name: DNS and routing diagnostics
        shell: bash
        run: |
          set -euo pipefail

          {
            echo '=== DNS ==='
            getent ahostsv4 fapi.binance.com || true
            getent ahostsv4 open-api-vst.bingx.com || true
            echo
            echo '=== ROUTES ==='
            ip -4 route || true
            echo
            echo '=== DIRECT PUBLIC ROUTE CHECK (NO PROXY) ==='
            curl -sS --noproxy '*' --connect-timeout 10 --max-time 20 https://fapi.binance.com/fapi/v1/ping || true
            echo
            echo '=== BINANCE PROXY ROUTE CHECK ==='
            curl -sS --noproxy "" --proxy "$BINANCE_HTTP_PROXY" --connect-timeout 10 --max-time 20 https://fapi.binance.com/fapi/v1/ping || true
            echo
            if ip link show wg0 >/dev/null 2>&1; then
              echo 'ERROR: global wg0 interface exists'
              exit 1
            fi
          } | tee vpn-audit/dns-routing.txt

      - name: Run public API requests and save exact responses
        shell: bash
        run: |
          BASE="${BINANCE_BASE_URL%/}"
          set -u

          request() {
            local label="$1"
            local url="$2"
            local safe_label
            safe_label="$(printf '%s' "$label" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-zA-Z0-9._-' '_')"
            local headers="vpn-audit/responses/${safe_label}.headers"
            local body="vpn-audit/responses/${safe_label}.body"
            local curl_error="vpn-audit/responses/${safe_label}.curl_error"
            local pretty="vpn-audit/pretty/${safe_label}.json"
            local http_status curl_exit body_sha body_bytes

            echo
            echo "================================================================"
            echo "REQUEST: $label"
            echo "URL: $url"
            echo "================================================================"

            local status_file="${body}.status"

            # Always create output files first. A network timeout can otherwise
            # leave the body file absent and crash the diagnostic itself.
            : > "$headers"
            : > "$body"
            : > "$curl_error"
            : > "$status_file"

            set +e
            if [[ "$label" == binance_* ]]; then
              curl -sS \
                --noproxy "" \
                --proxy "$BINANCE_HTTP_PROXY" \
                --connect-timeout 10 \
                --max-time 60 \
                -D "$headers" \
                -o "$body" \
                -w '%{http_code}' \
                "$url" >"$status_file" 2>"$curl_error"
            else
              curl -sS \
                --noproxy '*' \
                --connect-timeout 10 \
                --max-time 60 \
                -D "$headers" \
                -o "$body" \
                -w '%{http_code}' \
                "$url" >"$status_file" 2>"$curl_error"
            fi
            curl_exit=$?
            set -e

            http_status="$(cat "$status_file" 2>/dev/null || true)"
            [ -n "$http_status" ] || http_status="000"

            body_sha="$(sha256sum "$body" | awk '{print $1}')"
            body_bytes="$(wc -c < "$body" | tr -d ' ')"

            printf '%s|%s|%s|%s|%s|%s\n' \
              "$label" "$url" "$http_status" "$curl_exit" "$body_sha" "$body_bytes" \
              >> vpn-audit/manifest.tsv

            echo "HTTP_STATUS=$http_status"
            echo "CURL_EXIT=$curl_exit"
            echo "BODY_SHA256=$body_sha"
            echo "BODY_BYTES=$body_bytes"
            echo '--- CURL STDERR ---'
            cat "$curl_error" || true
            echo '--- RESPONSE HEADERS ---'
            cat "$headers" || true
            echo '--- RESPONSE BODY ---'
            if [ "$body_bytes" -le 262144 ]; then
              cat "$body" || true
            else
              echo "[large body: full exact response is in the uploaded artifact]"
              echo '--- BODY HEAD (8192 bytes) ---'
              head -c 8192 "$body" || true
              echo
              echo '--- BODY TAIL (8192 bytes) ---'
              tail -c 8192 "$body" || true
            fi
            echo

            # Pretty-print JSON when possible; leave non-JSON bodies untouched.
            python - "$body" "$pretty" <<'PY'
          import json, sys
          from pathlib import Path
          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          raw = src.read_text(errors='replace')
          try:
              obj = json.loads(raw)
          except Exception:
              dst.write_text(raw)
          else:
              dst.write_text(json.dumps(obj, indent=2, ensure_ascii=False, sort_keys=True))
          PY
          }

          echo '================ BINANCE FUTURES: BASIC ================'
          request 'binance_ping' \
            "$BASE/fapi/v1/ping"
          request 'binance_exchangeInfo' \
            "$BASE/fapi/v1/exchangeInfo"

          for symbol in ${AUDIT_SYMBOLS_BINANCE//,/ }; do
            request "binance_ticker_${symbol}" \
              "$BASE/fapi/v1/ticker/price?symbol=$symbol"
          done

          echo '================ BINANCE FUTURES: EXACT ENGINE KLINE SHAPES ================'
          request 'binance_BTCUSDT_1h_limit10' \
            "$BASE/fapi/v1/klines?symbol=BTCUSDT&interval=1h&limit=10"
          request 'binance_BTCUSDT_4h_limit10' \
            "$BASE/fapi/v1/klines?symbol=BTCUSDT&interval=4h&limit=10"
          request 'binance_BTCUSDT_15m_limit10' \
            "$BASE/fapi/v1/klines?symbol=BTCUSDT&interval=15m&limit=10"
          request 'binance_BTCUSDT_1d_limit400' \
            "$BASE/fapi/v1/klines?symbol=BTCUSDT&interval=1d&limit=400"

          echo '================ BINANCE FUTURES: REPRESENTATIVE LIVE SIGNAL SYMBOLS ================'
          for symbol in XRPUSDT KAITOUSDT; do
            request "binance_${symbol}_15m_limit250" \
              "$BASE/fapi/v1/klines?symbol=$symbol&interval=15m&limit=250"
            request "binance_${symbol}_1h_limit400" \
              "$BASE/fapi/v1/klines?symbol=$symbol&interval=1h&limit=400"
            request "binance_${symbol}_4h_limit400" \
              "$BASE/fapi/v1/klines?symbol=$symbol&interval=4h&limit=400"
            request "binance_${symbol}_1d_limit400" \
              "$BASE/fapi/v1/klines?symbol=$symbol&interval=1d&limit=400"
          done

          echo '================ BINGX VST: PUBLIC ================'
          request 'bingx_contracts' \
            "$BINGX_BASE_URL/openApi/swap/v2/quote/contracts"
          request 'bingx_live_price_all' \
            "$BINGX_BASE_URL/openApi/swap/v2/quote/price"

          for symbol in ${AUDIT_SYMBOLS_BINGX//,/ }; do
            request "bingx_${symbol}_1m_limit2" \
              "$BINGX_BASE_URL/openApi/swap/v3/quote/klines?symbol=$symbol&interval=1m&limit=2"
          done

      - name: Parse and cross-check the captured public responses
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, math, re
          from pathlib import Path

          root = Path('vpn-audit/responses')

          def read_json(name):
              path = root / name.lower()
              if not path.exists() or path.stat().st_size == 0:
                  return None
              try:
                  return json.loads(path.read_text())
              except Exception as exc:
                  failures = globals().get("failures")
                  if isinstance(failures, list):
                      failures.append(f"Invalid JSON in {name}: {exc}")
                  return None

          failures = []
          checks = []

          # Transport is a prerequisite for semantic checks. Do not turn a
          # network timeout (for example curl exit 28 / HTTP 000) into a
          # cascade of misleading "missing contract" / "row count" failures.
          manifest = Path('vpn-audit/manifest.tsv').read_text().splitlines()[1:]
          expected_request_count = 22
          if len(manifest) != expected_request_count:
              failures.append(
                  f'Manifest request count mismatch: expected {expected_request_count}, got {len(manifest)}'
              )
          labels = [line.split('|', 1)[0] for line in manifest if '|' in line]
          if len(labels) != len(set(labels)):
              failures.append('Duplicate request labels detected in manifest')

          transport_failures = []
          for line in manifest:
              parts = line.split('|')
              if len(parts) != 6:
                  failures.append(f'Bad manifest row: {line}')
                  continue
              label, url, status, curl_exit, body_sha, body_bytes = parts
              if status != '200' or curl_exit != '0':
                  transport_failures.append(
                      (label, status, curl_exit, url, body_sha, body_bytes)
                  )
              if not re.fullmatch(r'[0-9a-f]{64}', body_sha):
                  failures.append(f'Invalid SHA-256 for {label}: {body_sha}')
              if not body_bytes.isdigit():
                  failures.append(f'Invalid body byte count for {label}: {body_bytes}')

          if transport_failures:
              print('=== TRANSPORT FAILURES ===')
              for label, status, curl_exit, url, body_sha, body_bytes in transport_failures:
                  print(f'FAIL: {label} status={status} curl_exit={curl_exit} body_bytes={body_bytes}')
                  err = root / f"{label.lower()}.body.curl_error"
                  if err.exists() and err.stat().st_size:
                      print(f'CURL STDERR [{label}]:')
                      print(err.read_text(errors='replace').strip())
              print('=== SEMANTIC CHECKS SKIPPED ===')
              print('Transport must be healthy before exchange response semantics can be evaluated.')
              raise SystemExit(1)

          # The request() helper normalizes filenames to lowercase.
          exchange = read_json('binance_exchangeInfo.body')
          if not isinstance(exchange, dict):
              exchange = {}
          active_binance = {
              str(row.get('symbol', '')).upper(): row
              for row in exchange.get('symbols', [])
              if isinstance(row, dict)
              and str(row.get('status', '')).upper() == 'TRADING'
              and str(row.get('contractType', '')).upper() == 'PERPETUAL'
              and str(row.get('quoteAsset', '')).upper() == 'USDT'
          }

          for symbol in ('BTCUSDT', 'XRPUSDT', 'KAITOUSDT'):
              row = active_binance.get(symbol)
              checks.append({
                  'binance_symbol': symbol,
                  'active_usdt_perpetual': bool(row),
                  'contractType': row.get('contractType') if row else None,
                  'status': row.get('status') if row else None,
              })

          bx = read_json('bingx_contracts.body')
          bx_rows = bx.get('data', []) if isinstance(bx, dict) else []
          by_symbol = {str(row.get('symbol', '')).upper(): row for row in bx_rows if isinstance(row, dict)}
          for symbol in ('BTC-USDT', 'XRP-USDT', 'KAITO-USDT'):
              row = by_symbol.get(symbol)
              checks.append({
                  'bingx_symbol': symbol,
                  'contract_present': bool(row),
                  'status': row.get('status') if row else None,
                  'apiStateOpen': row.get('apiStateOpen') if row else None,
              })

          print('=== PARSED CROSS-CHECKS ===')
          print(json.dumps({
              'binance_active_usdt_perpetuals': len(active_binance),
              'bingx_contracts_returned': len(bx_rows),
              'checks': checks,
          }, indent=2, ensure_ascii=False, sort_keys=True))

          for item in checks:
              if item.get('binance_symbol'):
                  if not item.get('active_usdt_perpetual'):
                      failures.append(f"Binance missing active USDT perpetual: {item['binance_symbol']}")
              if item.get('bingx_symbol'):
                  if not item.get('contract_present'):
                      failures.append(f"BingX missing contract: {item['bingx_symbol']}")
                  elif str(item.get('status')) != '1':
                      failures.append(f"BingX contract not status=1: {item['bingx_symbol']} status={item.get('status')}")
                  elif str(item.get('apiStateOpen')).lower() != 'true':
                      failures.append(f"BingX contract apiStateOpen != true: {item['bingx_symbol']} value={item.get('apiStateOpen')}")

          for name in (
              'binance_BTCUSDT_1h_limit10.body',
              'binance_BTCUSDT_4h_limit10.body',
              'binance_BTCUSDT_15m_limit10.body',
          ):
              rows = read_json(name)
              if not isinstance(rows, list):
                  failures.append(f'Invalid/missing Binance kline response: {name}')
                  rows = []
              print(f'{name}: rows={len(rows)} first_open={rows[0][0] if rows else None} last_open={rows[-1][0] if rows else None}')
              if len(rows) != 10:
                  failures.append(f'Binance row count != 10 for {name}: {len(rows)}')

          for symbol in ('XRPUSDT', 'KAITOUSDT'):
              for interval, limit in (('15m', 250), ('1h', 400), ('4h', 400), ('1d', 400)):
                  name = f'binance_{symbol}_{interval}_limit{limit}.body'
                  rows = read_json(name)
                  if not isinstance(rows, list):
                      failures.append(f'Invalid/missing Binance kline response: {name}')
                      rows = []
                  print(f'{name}: rows={len(rows)} first_open={rows[0][0] if rows else None} last_open={rows[-1][0] if rows else None}')
                  if len(rows) != limit:
                      failures.append(f'Binance row count != {limit} for {name}: {len(rows)}')

          for symbol in ('BTC-USDT', 'XRP-USDT', 'KAITO-USDT'):
              name = f'bingx_{symbol}_1m_limit2.body'
              rows = read_json(name)
              data = rows.get('data') if isinstance(rows, dict) else None
              code = rows.get('code') if isinstance(rows, dict) else None
              count = len(data) if isinstance(data, list) else None
              print(f'{name}: code={code} rows={count}')
              if code != 0:
                  failures.append(f'BingX kline code != 0 for {symbol}: {code}')
              if count != 2:
                  failures.append(f'BingX kline row count != 2 for {symbol}: {count}')

          # Cross-exchange price sanity check must use BingX live/latest-price data,
          # not a closed 1m candle. This is observational only; no orders are placed.
          bingx_live = read_json('bingx_live_price_all.body')
          bingx_live_rows = bingx_live.get('data') if isinstance(bingx_live, dict) else None
          if isinstance(bingx_live_rows, dict):
              bingx_live_rows = [bingx_live_rows]
          if not isinstance(bingx_live_rows, list):
              failures.append('BingX live-price response has no data list/object')
              bingx_live_rows = []
          live_by_symbol = {
              str(row.get('symbol', '')).upper(): row
              for row in bingx_live_rows
              if isinstance(row, dict)
          }

          for b_symbol, bx_symbol in (
              ('BTCUSDT', 'BTC-USDT'),
              ('XRPUSDT', 'XRP-USDT'),
              ('KAITOUSDT', 'KAITO-USDT'),
          ):
              bt = read_json(f'binance_ticker_{b_symbol}.body')
              live_row = live_by_symbol.get(bx_symbol)
              try:
                  bp = float(bt['price'])
                  bxp = float(live_row['price']) if live_row else float('nan')
                  if not math.isfinite(bxp) or bxp <= 0:
                      raise ValueError(f'invalid BingX live price row: {live_row!r}')
                  drift = abs(bp - bxp) / bp * 100.0
                  print(f'PRICE_GUARD {b_symbol}/{bx_symbol}: binance={bp} bingx_live={bxp} drift_pct={drift:.6f}')
                  if not math.isfinite(drift) or drift > 1.0:
                      failures.append(
                          f'Cross-exchange live price drift >1% for {b_symbol}/{bx_symbol}: {drift:.6f}%'
                      )
              except Exception as exc:
                  failures.append(f'Live price cross-check failed for {b_symbol}/{bx_symbol}: {exc}')

          if failures:
              print('=== AUDIT FAILURES ===')
              for failure in failures:
                  print(f'FAIL: {failure}')
              raise SystemExit(1)

          print('=== AUDIT RESULT: PASS ===')
          PY

      - name: Print manifest
        if: always()
        shell: bash
        run: |
          echo '================ FINAL REQUEST MANIFEST ================'
          cat vpn-audit/manifest.tsv || true

      - name: Cleanup Binance WireProxy before artifact upload
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${VPN_DIR:-}" ] && [ -f "$VPN_DIR/wireproxy.pid" ]; then
            pid="$(cat "$VPN_DIR/wireproxy.pid" 2>/dev/null || true)"
            if [ -n "$pid" ]; then
              kill "$pid" >/dev/null 2>&1 || true
              sleep 1
              kill -9 "$pid" >/dev/null 2>&1 || true
            fi
            rm -rf "$VPN_DIR"
          fi

      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-exchange-deep-diagnostic
          path: vpn-audit/
          if-no-files-found: warn
          retention-days: 1

      - name: Final diagnostic status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DIAGNOSTIC ARTIFACT READY ==='
          ls -lh vpn-audit || true
          rows=$(($(wc -l < vpn-audit/manifest.tsv)-1))
          echo "manifest_rows=$rows"
          test "$rows" -eq 22
          echo "=== DIAGNOSTIC REQUEST COUNT: 22/22 ==="
