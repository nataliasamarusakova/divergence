name: VPN + Binance Futures Connectivity Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vpn-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      BINANCE_BASE_URL: https://fapi.binance.com
      VPN_EXPECTED_COUNTRY: NL

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect WireGuard package version
        id: wireguard-package
        shell: bash
        run: |
          set -euo pipefail

          version="$(apt-cache policy wireguard-tools 2>/dev/null | awk '/Candidate:/ {print $2; exit}')"
          if [ -z "${version:-}" ] || [ "$version" = "(none)" ]; then
            echo "wireguard-tools candidate is not present; refreshing APT indexes once."
            sudo apt-get update -qq
            version="$(apt-cache policy wireguard-tools | awk '/Candidate:/ {print $2; exit}')"
          fi

          test -n "${version:-}" && test "$version" != "(none)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wireguard-tools candidate=$version"

      - name: Cache WireGuard package
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: wireguard-tools-ubuntu-24.04-${{ steps.wireguard-package.outputs.version }}

      - name: Install WireGuard tools
        shell: bash
        run: |
          set -euo pipefail

          CACHE_DIR="$HOME/.cache/apt-archives"
          mkdir -p "$CACHE_DIR"

          if ! command -v wg >/dev/null 2>&1 || ! command -v wg-quick >/dev/null 2>&1; then
            deb="$(find "$CACHE_DIR" -maxdepth 1 -type f -name 'wireguard-tools_*.deb' -print -quit || true)"
            if [ -z "$deb" ]; then
              if ! (cd "$CACHE_DIR" && apt-get download "wireguard-tools=${{ steps.wireguard-package.outputs.version }}"); then
                sudo apt-get update -qq
                (cd "$CACHE_DIR" && apt-get download "wireguard-tools=${{ steps.wireguard-package.outputs.version }}")
              fi
              deb="$(find "$CACHE_DIR" -maxdepth 1 -type f -name 'wireguard-tools_*.deb' -print -quit || true)"
            fi
            test -n "$deb"
            sudo dpkg -i "$deb" || sudo apt-get -f install -y
          fi

          command -v resolvconf >/dev/null 2>&1 || sudo apt-get install -y resolvconf

      - name: Connect Proton WireGuard VPN
        env:
          WIREGUARD_CONF: ${{ secrets.WIREGUARD_CONF }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WIREGUARD_CONF:-}"
          printf '%s\n' "$WIREGUARD_CONF" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sudo wg show wg0

          curl -fsS --max-time 10 https://ipinfo.io/json -o /tmp/ipinfo.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/ipinfo.json').read_text())
          print(json.dumps({k: data.get(k) for k in ('ip', 'country', 'city', 'org')}, indent=2))
          expected = 'NL'
          actual = str(data.get('country', '')).upper()
          if actual != expected:
              raise SystemExit(f'Unexpected VPN country: expected {expected}, got {actual}')
          PY

      - name: Test Binance Futures API
        shell: bash
        run: |
          set -euo pipefail
          BASE="${BINANCE_BASE_URL%/}"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl -fsS --max-time 15 "$BASE/fapi/v1/ping" -o "$TMP_DIR/ping.json"
          curl -fsS --max-time 15 "$BASE/fapi/v1/time" -o "$TMP_DIR/time.json"
          curl -fsS --max-time 15 "$BASE/fapi/v1/exchangeInfo" -o "$TMP_DIR/exchange.json"
          curl -fsS --max-time 15 "$BASE/fapi/v1/klines?symbol=BTCUSDT&interval=1h&limit=10" -o "$TMP_DIR/klines.json"
          curl -fsS --max-time 15 "$BASE/fapi/v1/klines?symbol=BTCUSDT&interval=4h&limit=10" -o "$TMP_DIR/klines4h.json"
          curl -fsS --max-time 15 "$BASE/fapi/v1/klines?symbol=BTCUSDT&interval=15m&limit=10" -o "$TMP_DIR/klines15m.json"
          curl -fsS --max-time 15 "$BASE/fapi/v1/ticker/price?symbol=BTCUSDT" -o "$TMP_DIR/ticker.json"

          TMP_DIR="$TMP_DIR" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['TMP_DIR'])
          exchange = json.loads((root / 'exchange.json').read_text())
          active = [
              row for row in exchange.get('symbols', [])
              if str(row.get('status', '')).upper() == 'TRADING'
              and str(row.get('contractType', '')).upper() == 'PERPETUAL'
              and str(row.get('quoteAsset', '')).upper() == 'USDT'
          ]
          if not any(str(row.get('symbol', '')).upper() == 'BTCUSDT' for row in active):
              raise SystemExit('BTCUSDT missing from active USDT perpetuals')

          for name in ('klines.json', 'klines4h.json', 'klines15m.json'):
              rows = json.loads((root / name).read_text())
              if not isinstance(rows, list) or len(rows) < 2:
                  raise SystemExit(f'{name}: invalid response')

          ticker = json.loads((root / 'ticker.json').read_text())
          if float(ticker.get('price', 0)) <= 0:
              raise SystemExit(f'Invalid ticker: {ticker}')

          print(f'Binance Futures connectivity OK: active_usdt_perpetuals={len(active)}')
          print(f"BTCUSDT price={ticker['price']}; 1h/4h/15m klines=OK")
          PY

      - name: Cleanup VPN
        if: always()
        shell: bash
        run: |
          sudo wg-quick down wg0 >/dev/null 2>&1 || true
