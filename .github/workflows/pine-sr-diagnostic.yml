name: Ajay R5.41 Pine SR Diagnostic

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "TradingView Binance perpetual ticker, for example BTCUSDT.P"
        required: true
        default: "BTCUSDT.P"
        type: string
  repository_dispatch:
    types: [run_pine_sr_diagnostic]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VPN_EXPECTED_COUNTRY: NL
      BINANCE_BASE_URL: "https://fapi.binance.com"
      BINANCE_HTTP_TIMEOUT_SEC: "5"
      BINANCE_REQUEST_MIN_INTERVAL_SEC: "0.10"
      BINANCE_MARKET_RETRY_ATTEMPTS: "2"
      BINANCE_MARKET_RETRY_BACKOFF_SEC: "0.5"
      BINANCE_EXCHANGE_INFO_TTL_SEC: "900"
      AJAY_SR_KLINE_LIMIT_1H: "1500"
      AJAY_SR_SWING_LENGTH: "10"
      AJAY_SR_HISTORY_TO_KEEP: "20"
      AJAY_SR_BOX_WIDTH: "2.5"
      AJAY_SR_ATR_LENGTH: "50"
      AJAY_SR_MAX_DATA_AGE_MIN: "190"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate canonical Divergence version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from event_engine.version import APP_VERSION
          if not re.fullmatch(r"divergence-v\d+\.\d+", APP_VERSION):
              raise SystemExit(f"Invalid VERSION value: {APP_VERSION!r}")
          print(f"[VERSION] {APP_VERSION}")
          PY

      - name: Install requests
        run: python -m pip install --quiet --disable-pip-version-check requests

      # Keep Binance Futures diagnostic traffic on the same pinned WireProxy egress
      # used by the production event engine. No global WireGuard interface is made.
      - name: Install pinned Binance WireProxy
        env:
          WIREPROXY_VERSION: v1.1.3
          WIREPROXY_URL: https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          WIREPROXY_SHA256: e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cache/wireproxy"
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$CACHE_DIR" "$BIN_DIR"
          ARCHIVE="$CACHE_DIR/wireproxy_linux_amd64.tar.gz"
          if [ ! -s "$ARCHIVE" ] || [ "$(sha256sum "$ARCHIVE" | awk '{print $1}')" != "$WIREPROXY_SHA256" ]; then
            curl --fail --silent --show-error --location "$WIREPROXY_URL" -o "$ARCHIVE"
          fi
          echo "$WIREPROXY_SHA256  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$CACHE_DIR"
          test -f "$CACHE_DIR/wireproxy"
          install -m 0755 "$CACHE_DIR/wireproxy" "$BIN_DIR/wireproxy"

      - name: Start Binance-only WireProxy
        env:
          WIREGUARD_CONF: ${{ secrets.WIREGUARD_CONF }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WIREGUARD_CONF:-}"
          export VPN_DIR="$(mktemp -d)"
          echo "VPN_DIR=$VPN_DIR" >> "$GITHUB_ENV"
          WG_CONF="$VPN_DIR/wg.conf"
          PROXY_CONF="$VPN_DIR/wireproxy.conf"
          printf '%s\n' "$WIREGUARD_CONF" > "$WG_CONF"
          chmod 600 "$WG_CONF"
          cat > "$PROXY_CONF" <<EOF
          WGConfig = $WG_CONF

          [http]
          BindAddress = 127.0.0.1:18080
          EOF
          chmod 600 "$PROXY_CONF"
          "$HOME/.local/bin/wireproxy" --configtest -c "$PROXY_CONF" >/dev/null
          "$HOME/.local/bin/wireproxy" -c "$PROXY_CONF" >"$VPN_DIR/wireproxy.log" 2>&1 &
          echo $! > "$VPN_DIR/wireproxy.pid"
          for _ in $(seq 1 30); do
            if curl --silent --fail --noproxy "" \
              --proxy "http://127.0.0.1:18080" \
              --connect-timeout 3 --max-time 8 \
              https://ipinfo.io/json -o "$VPN_DIR/proxy-ipinfo.json"; then
              break
            fi
            sleep 1
          done
          test -s "$VPN_DIR/proxy-ipinfo.json" || {
            echo 'ERROR: Binance WireProxy did not become usable' >&2
            cat "$VPN_DIR/wireproxy.log" >&2 || true
            exit 1
          }
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          vpn_dir = Path(os.environ["VPN_DIR"])
          data = json.loads((vpn_dir / "proxy-ipinfo.json").read_text())
          expected = os.environ["VPN_EXPECTED_COUNTRY"]
          actual = str(data.get("country", "")).upper()
          if expected and actual != expected.upper():
              raise SystemExit(f"VPN country mismatch: expected {expected}, got {actual}")
          PY
          if ip link show wg0 >/dev/null 2>&1; then
            echo 'ERROR: global wg0 interface exists; Binance VPN must remain userspace-only' >&2
            exit 1
          fi
          echo "BINANCE_VPN_ENABLED=true" >> "$GITHUB_ENV"
          echo "BINANCE_HTTP_PROXY=http://127.0.0.1:18080" >> "$GITHUB_ENV"

      - name: Resolve symbol
        id: inputs
        shell: bash
        env:
          EVENT_SYMBOL: ${{ github.event.client_payload.symbol }}
          INPUT_SYMBOL: ${{ inputs.symbol }}
        run: |
          set -euo pipefail
          symbol="${INPUT_SYMBOL:-}"
          if [[ -z "$symbol" ]]; then symbol="${EVENT_SYMBOL:-BTCUSDT.P}"; fi
          echo "symbol=$symbol" >> "$GITHUB_OUTPUT"

      - name: Display Pine SR zones (highest to lowest)
        env:
          DIAG_SYMBOL: ${{ steps.inputs.outputs.symbol }}
        run: |
          set -euo pipefail
          python pine_sr_diagnostic.py --symbol "$DIAG_SYMBOL"

      - name: Stop Binance WireProxy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VPN_DIR:-}" ] && [ -f "$VPN_DIR/wireproxy.pid" ]; then
            pid="$(cat "$VPN_DIR/wireproxy.pid" || true)"
            if [ -n "$pid" ]; then
              kill "$pid" >/dev/null 2>&1 || true
              for _ in $(seq 1 10); do
                if ! kill -0 "$pid" >/dev/null 2>&1; then break; fi
                sleep 1
              done
              kill -9 "$pid" >/dev/null 2>&1 || true
            fi
            rm -rf "$VPN_DIR"
          fi
