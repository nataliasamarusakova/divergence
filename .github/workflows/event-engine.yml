name: Event Driven Divergence Monitor

on:
  # no in-repo cron schedule is wanted).
  repository_dispatch:
    types: [run_event_engine]

permissions:
  contents: write

concurrency:
  # _file_lock_pace/_acquire_scan_slot are intentionally process-local. This
  # workflow-level group prevents two GitHub-hosted runners for the same event
  # engine from running overlapping market-data scans and bypassing local pacing.
  group: divergence-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      COINALYZE_URL: ${{ secrets.COINALYZE_URL }}
      COINALYZE_P_SID: ${{ secrets.COINALYZE_P_SID }}
      COINALYZE_CHAT_SID: ${{ secrets.COINALYZE_CHAT_SID }}
      BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
      BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
      BINGX_ENV: vst
      BINGX_BASE_URL: https://open-api-vst.bingx.com
      BINGX_MARGIN_USDT: "1"
      BINGX_LEVERAGE: "10"
      BINGX_MAX_LEVERAGE: "10"
      BINGX_POSITION_MODE: HEDGE
      MARKET_DATA_SOURCE: binance
      BINANCE_BASE_URL: https://fapi.binance.com
      BINANCE_HTTP_TIMEOUT_SEC: "5"
      BINANCE_REQUEST_MIN_INTERVAL_SEC: "0.10"
      BINANCE_MARKET_RETRY_ATTEMPTS: "2"
      BINANCE_MARKET_RETRY_BACKOFF_SEC: "0.5"
      BINANCE_EXCHANGE_INFO_TTL_SEC: "900"
      EXECUTION_ENABLED: "true"
      EXECUTION_MODE: vst
      REQUIRE_CVD_CONFIRMATION: "false"
      ENTRY_QUALITY_GATE_ENABLED: "true"
      ENTRY_QUALITY_MODE: "shadow"
      MIN_SETUP_SCORE: "60"
      MIN_SHORT_SETUP_SCORE: "75"
      # Ajay R5.41 S/R room is checked only for final trade candidates, immediately
      # before order placement. SPOT is kept for now; futures can be added later
      # after feed-to-TradingView validation.
      AJAY_SR_ROOM_ENABLED: "true"
      AJAY_SR_ROOM_MODE: "enforce"
      # Missing Binance Spot S/R source/data is diagnostic only; it must not veto an otherwise valid entry.
      AJAY_SR_REQUIRE_DATA: "false"
      AJAY_SR_SPOT_BASE_URL: "https://data-api.binance.vision"
      AJAY_SR_HTTP_PROXY: "http://127.0.0.1:18080"
      AJAY_SR_KLINE_LIMIT_1H: "1000"
      AJAY_SR_RB: "10"
      AJAY_SR_PRD: "284"
      AJAY_SR_CHANNEL_W: "10"
      AJAY_SR_STRENGTH: "2"
      AJAY_SR_ZONE_SCALE: "1.0"
      AJAY_SR_ENTRY_BUFFER_PCT: "0.05"
      AJAY_SR_TARGET_BUFFER_PCT: "0.05"
      AJAY_SR_TARGET_BUFFER_R: "0.10"
      AJAY_SR_SUPPORT_CONTEXT_MAX_R: "3.0"
      AJAY_SR_HTTP_TIMEOUT_SEC: "5"
      AJAY_SR_REQUEST_MIN_INTERVAL_SEC: "0.10"
      AJAY_SR_SPOT_EXCHANGE_INFO_TTL_SEC: "900"
      AJAY_SR_MAX_DATA_AGE_MIN: "130"
      MAX_SR_DATA_REJECTIONS: "3"
      ENTRY_WEAK_ENGINE_BLOCK_ENABLED: "true"
      ENTRY_BLOCKED_EVENT_TYPES: "MA_COMPRESSION_BREAKOUT,CRT_BULLISH,CRT_BEARISH,EMA_PULLBACK_CONTINUATION,LIQUIDITY_SWEEP_RECLAIM,VOLUME_PROFILE_DISTRIBUTION,BREAKER_BLOCK_BEARISH"
      SHORT_OI_VETO_ENABLED: "true"
      SHORT_OI_VETO_PCT: "-5.00"
      COMPOUND_CVD_LIQ_VETO_ENABLED: "true"
      COMPOUND_CVD_MAX: "25"
      COMPOUND_LIQ_LONG_MIN: "150000"
      SYMBOL_LOSS_COOLDOWN_MIN: "360"
      # TP count adapts to the filled position size: 2 legs when supported, otherwise one terminal TP3.
      REJECT_SINGLE_TP: "false"
      REQUIRE_MULTI_TP: "false"
      FIXED_STOP_LOSS_PCT: "7.00"
      REJECT_ATR_RISK_CLIP: "false"
      MAX_ENTRY_RISK_PCT: "7.00"
      DIVERGENCE_VOLUME_CONFIRMATION_ENABLED: "true"
      ENABLE_VOLUME_PROFILE_DIVERGENCE_ENGINE: "true"
      ENABLE_HARMONIC_PATTERN_ENGINE: "true"
      CROSS_EXCHANGE_PRICE_GUARD_ENABLED: "true"
      MAX_CROSS_EXCHANGE_DRIFT_PCT: "1.00"
      REQUIRE_15M_TRIGGER: "true"
      MAX_TRIGGER_DELAY_MIN: "30"
      MAX_TRIGGER_TO_ORDER_DELAY_MIN: "8"
      MAX_DIVERGENCE_FORMATION_AGE_MIN: "45"
      MAX_DIVERGENCE_POST_CONFIRM_AGE_MIN: "45"
      DIVERGENCE_SHADOW_ONLY: "false"
      MAX_PRE_ORDER_DRIFT_REJECTIONS: "3"
      MAX_CROSS_EXCHANGE_DRIFT_REJECTIONS: "3"
      MA_COMPRESSION_RETEST_MAX_DELAY_MIN: "120"
      BREAKOUT_MOMENTUM_RETEST_MAX_DELAY_MIN: "90"
      VOLATILITY_SQUEEZE_RETEST_MAX_DELAY_MIN: "60"
      ORDER_BLOCK_RETEST_MAX_DELAY_MIN: "120"
      BREAKER_BLOCK_RETEST_MAX_DELAY_MIN: "120"
      MITIGATION_BLOCK_RETEST_MAX_DELAY_MIN: "120"
      SFP_RETEST_MAX_DELAY_MIN: "60"
      LIQUIDITY_SWEEP_RETEST_MAX_DELAY_MIN: "60"
      LIQUIDATION_CASCADE_FVG_RETEST_MAX_DELAY_MIN: "90"
      CRT_RETEST_MAX_DELAY_MIN: "60"
      KLINE_LIMIT_1D: "400"
      BINGX_KLINE_SCAN_MIN_INTERVAL_SEC: "1.25"
      BINGX_KLINE_RETRY_ATTEMPTS: "3"
      BINGX_KLINE_RETRY_BACKOFF_SEC: "1.0"
      BINGX_KLINE_RATE_LIMIT_FALLBACK_SEC: "900"
      REQUIRE_4H_CONTEXT_FOR_1H: "true"
      ENABLE_MACD_4H_ENGINE: "true"
      ENABLE_MA_COMPRESSION_ENGINE: "true"
      ENABLE_BREAKOUT_MOMENTUM_ENGINE: "true"
      ENABLE_DONCHIAN_RETEST_ENGINE: "true"
      ENABLE_LIQUIDITY_SWEEP_ENGINE: "true"
      ENABLE_EMA_PULLBACK_ENGINE: "true"
      ENABLE_ORDER_BLOCK_ENGINE: "true"
      ENABLE_BREAKER_BLOCK_ENGINE: "true"
      ENABLE_MITIGATION_BLOCK_ENGINE: "false"
      ENABLE_MITIGATION_BLOCK_BULLISH_ENGINE: "false"
      ENABLE_SFP_ENGINE: "true"
      ENABLE_LIQUIDATION_CASCADE_FVG_ENGINE: "false"
      ENABLE_CRT_ENGINE: "true"
      EXTREME_SHORT_FUNDING: "-0.50"
      EXTREME_LONG_FUNDING: "0.50"
      FUNDING_REQUIRED: "false"
      BE_AFTER_LEG: "tp1"
      EARLY_LOSS_CUT_ENABLED: "false"
      EARLY_LOSS_CUT_2H_MIN: "120"
      EARLY_LOSS_CUT_2H_PNL: "-1.50"
      EARLY_LOSS_CUT_4H_MIN: "240"
      EARLY_LOSS_CUT_4H_PNL: "-2.50"
      MAX_ACTIVE_TRADES: "12"
      MAX_ACTIVE_LONGS: "6"
      MAX_ACTIVE_SHORTS: "6"
      # VST research mode: deliberately no simultaneous-position cap.
      PORTFOLIO_CAP_ENABLED: "false"
      MAX_EVENT_AGE_MIN: "60"
      SQUEEZE_RELEASE_LOOKBACK_BARS: "4"
      MAX_TRADES_PER_CYCLE: "0"
      MIN_VOLUME_24H: "25000000"
      MIN_OPEN_INTEREST: "10000000"
      MAX_CANDIDATES: "0"
      KLINE_LIMIT_1H: "400"
      KLINE_LIMIT_15M: "250"
      KLINE_LIMIT_4H: "400"
      RECONCILIATION_HTTP_TIMEOUT_SEC: "5"
      RECONCILIATION_MAX_SECONDS: "45"
      BINGX_HTTP_TIMEOUT_SEC: "10"
      LIQ_SQUEEZE_ENGINE_ENABLED: "false"
      LIQ_SQUEEZE_MIN_LIQ_OI_RATIO: "0.01"
      LIQ_SQUEEZE_MIN_OI_CHG4H_PCT: "1.5"
      LIQ_SQUEEZE_FUNDING_EXTREME: "0.03"
      LIQ_SQUEEZE_PRICE_SPIKE_ATR: "1.0"
      SYMBOL_ENTRY_COOLDOWN_MIN: "15"
      SQUEEZE_SYMBOL_ENTRY_COOLDOWN_MIN: "45"
      MAX_SHORT_SQUEEZE_ADVERSE_FUNDING: "-0.10"
      MAX_LONG_SQUEEZE_ADVERSE_FUNDING: "0.10"
      MAX_ENTRY_DRIFT_PCT: "2.00"
      MAX_SQUEEZE_ENTRY_DRIFT_PCT: "2.00"
      MAX_HOT_OI_CHG24_PCT: "50"
      HOT_OI_SCORE_PENALTY: "15"
      SYMBOL_MAX_CONSECUTIVE_LOSSES: "3"
      SYMBOL_QUARANTINE_MIN: "360"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
      VPN_EXPECTED_COUNTRY: NL

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache dependencies and browsers
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
            ~/.cache/wireproxy
          key: deps-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-playwright-wireproxy-v1.1.3
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      # Binance uses a userspace WireGuard HTTP proxy only. The proxy is scoped to
      # BinanceMarketClient; BingX, Coinalyze, Telegram, GitHub and git remain direct.
      - name: Install pinned Binance WireProxy
        env:
          WIREPROXY_VERSION: v1.1.3
          WIREPROXY_URL: https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          WIREPROXY_SHA256: e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cache/wireproxy"
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$CACHE_DIR" "$BIN_DIR"
          ARCHIVE="$CACHE_DIR/wireproxy_linux_amd64.tar.gz"
          if [ ! -s "$ARCHIVE" ] || [ "$(sha256sum "$ARCHIVE" | awk '{print $1}')" != "$WIREPROXY_SHA256" ]; then
            curl --fail --silent --show-error --location \
              "$WIREPROXY_URL" -o "$ARCHIVE"
          fi
          echo "$WIREPROXY_SHA256  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$CACHE_DIR"
          test -f "$CACHE_DIR/wireproxy"
          install -m 0755 "$CACHE_DIR/wireproxy" "$BIN_DIR/wireproxy"
          "$BIN_DIR/wireproxy" --version

      - name: Start Binance-only WireProxy
        env:
          WIREGUARD_CONF: ${{ secrets.WIREGUARD_CONF }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${WIREGUARD_CONF:-}"
          export VPN_DIR="$(mktemp -d)"
          echo "VPN_DIR=$VPN_DIR" >> "$GITHUB_ENV"
          WG_CONF="$VPN_DIR/wg.conf"
          PROXY_CONF="$VPN_DIR/wireproxy.conf"
          printf '%s\n' "$WIREGUARD_CONF" > "$WG_CONF"
          chmod 600 "$WG_CONF"

          cat > "$PROXY_CONF" <<EOF
          WGConfig = $WG_CONF

          [http]
          BindAddress = 127.0.0.1:18080
          EOF
          chmod 600 "$PROXY_CONF"

          "$HOME/.local/bin/wireproxy" --configtest -c "$PROXY_CONF"
          "$HOME/.local/bin/wireproxy" -c "$PROXY_CONF" >"$VPN_DIR/wireproxy.log" 2>&1 &
          echo $! > "$VPN_DIR/wireproxy.pid"

          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail --noproxy "" \
              --proxy "http://127.0.0.1:18080" \
              --connect-timeout 3 --max-time 8 \
              https://ipinfo.io/json -o "$VPN_DIR/proxy-ipinfo.json"; then
              break
            fi
            sleep 1
          done

          test -s "$VPN_DIR/proxy-ipinfo.json" || {
            echo 'ERROR: Binance WireProxy did not become usable' >&2
            cat "$VPN_DIR/wireproxy.log" >&2 || true
            exit 1
          }

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          vpn_dir = Path(os.environ["VPN_DIR"])
          data = json.loads((vpn_dir / "proxy-ipinfo.json").read_text())
          expected = os.environ["VPN_EXPECTED_COUNTRY"]
          actual = str(data.get("country", "")).upper()
          print(json.dumps({k: data.get(k) for k in ("ip", "country", "city", "org")}, indent=2))
          if expected and actual != expected.upper():
              raise SystemExit(f"VPN country mismatch: expected {expected}, got {actual}")
          PY

          echo '=== DIRECT EGRESS (NO PROXY) ==='
          curl --fail --silent --show-error --noproxy '*' --max-time 10 https://ipinfo.io/json
          echo

          if ip link show wg0 >/dev/null 2>&1; then
            echo 'ERROR: global wg0 interface exists; Binance VPN must remain userspace-only' >&2
            exit 1
          fi

      - name: Run engine
        env:
          BINANCE_VPN_ENABLED: "true"
          BINANCE_HTTP_PROXY: http://127.0.0.1:18080
        run: |
          python run_once.py

      - name: Stop Binance WireProxy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VPN_DIR:-}" ] && [ -f "$VPN_DIR/wireproxy.pid" ]; then
            pid="$(cat "$VPN_DIR/wireproxy.pid" || true)"
            if [ -n "$pid" ]; then
              kill "$pid" >/dev/null 2>&1 || true
              for _ in $(seq 1 10); do
                if ! kill -0 "$pid" >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done
              kill -9 "$pid" >/dev/null 2>&1 || true
            fi
            cat "$VPN_DIR/wireproxy.log" || true
            rm -rf "$VPN_DIR"
          fi

      - name: Commit state
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "actions-user"
          git config user.email "actions@github.com"

          echo "=== LOCAL RUNTIME STATE BEFORE MERGE ==="
          git status --short

          # The engine's two persistent caches are intentionally ordinary repository
          # files, matching the v9 runtime design. Never delete data/ between runs.
          # Before committing, merge the scheduler state with the current remote copy.
          # This prevents a queued repository_dispatch run that started from an older
          # checkout from overwriting newer per-symbol watermarks.
          git fetch --prune origin main

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          state_path = Path("data/timeframe_scan_state.json")

          def read_json(path):
              if not path.exists():
                  return {}
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return {}
              return value if isinstance(value, dict) else {}

          local = read_json(state_path)
          if local.get("version") != 2 or not isinstance(local.get("symbols"), dict):
              local = {"version": 2, "symbols": {}}

          try:
              remote_raw = subprocess.check_output(
                  ["git", "show", "origin/main:data/timeframe_scan_state.json"],
                  text=True,
                  stderr=subprocess.DEVNULL,
              )
              remote = json.loads(remote_raw)
          except (subprocess.CalledProcessError, json.JSONDecodeError):
              remote = {}

          if not isinstance(remote, dict) or remote.get("version") != 2 or not isinstance(remote.get("symbols"), dict):
              remote = {"version": 2, "symbols": {}}

          merged = {"version": 2, "symbols": {}}
          all_symbols = set(local["symbols"]) | set(remote["symbols"])

          for symbol in sorted(all_symbols):
              lrec = local["symbols"].get(symbol)
              rrec = remote["symbols"].get(symbol)
              lrec = lrec if isinstance(lrec, dict) else {}
              rrec = rrec if isinstance(rrec, dict) else {}
              out = {}

              for tf in ("1h", "4h"):
                  candidates = []
                  for rec in (lrec, rrec):
                      try:
                          value = int(rec.get(tf))
                      except (TypeError, ValueError):
                          continue
                      candidates.append(value)
                  if candidates:
                      out[tf] = max(candidates)

              try:
                  lts = int(lrec.get("updated_ts", 0) or 0)
              except (TypeError, ValueError):
                  lts = 0
              try:
                  rts = int(rrec.get("updated_ts", 0) or 0)
              except (TypeError, ValueError):
                  rts = 0
              if max(lts, rts) > 0:
                  out["updated_ts"] = max(lts, rts)

              if out:
                  merged["symbols"][symbol] = out

          state_path.parent.mkdir(parents=True, exist_ok=True)
          state_path.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              f"[PERSISTENCE] merged scheduler state local={len(local['symbols'])} "
              f"remote={len(remote['symbols'])} merged={len(merged['symbols'])}"
          )
          PY

          if [ ! -s data/timeframe_scan_state.json ]; then
            echo "[COMMIT_STATE] ERROR: scheduler state is missing or empty" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/timeframe_scan_state.json")
          raw = json.loads(p.read_text(encoding="utf-8"))
          symbols = raw.get("symbols") if isinstance(raw, dict) else None
          if raw.get("version") != 2 or not isinstance(symbols, dict):
              raise SystemExit("[COMMIT_STATE] ERROR: invalid scheduler state schema")
          print(f"[COMMIT_STATE] scheduler state version=2 symbols={len(symbols)}")
          PY

          git add -f data/timeframe_scan_state.json
          git add data/*.jsonl data/*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "[COMMIT_STATE] No runtime state changes"
            git fetch --prune origin main
            if ! git cat-file -e origin/main:data/timeframe_scan_state.json 2>/dev/null; then
              echo "[COMMIT_STATE] ERROR: local state unchanged but origin/main has no scheduler state" >&2
              exit 1
            fi
            local_sha="$(sha256sum data/timeframe_scan_state.json | awk '{print $1}')"
            remote_sha="$(git show origin/main:data/timeframe_scan_state.json | sha256sum | awk '{print $1}')"
            echo "[PERSISTENCE] local_sha256=$local_sha"
            echo "[PERSISTENCE] remote_sha256=$remote_sha"
            if [ "$local_sha" != "$remote_sha" ]; then
              echo "[COMMIT_STATE] ERROR: remote scheduler state differs despite no local diff" >&2
              exit 1
            fi
            echo "[COMMIT_STATE] Remote scheduler state verified; no commit required"
            exit 0
          fi

          git commit -m "event engine snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch --prune origin main

            # A later/parallel queued run can move main forward. Rebase the already
            # merged runtime snapshot before each push attempt.
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              # Recreate the merge against the newer remote state on the next attempt.
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $((attempt * 3))
                continue
              fi
              break
            fi

            if git push origin HEAD:main; then
              git fetch --prune origin main
              remote_sha="$(git show origin/main:data/timeframe_scan_state.json | sha256sum | awk '{print $1}')"
              local_sha="$(sha256sum data/timeframe_scan_state.json | awk '{print $1}')"
              echo "[PERSISTENCE] local_sha256=$local_sha"
              echo "[PERSISTENCE] remote_sha256=$remote_sha"
              if [ "$local_sha" != "$remote_sha" ]; then
                echo "[COMMIT_STATE] ERROR: remote scheduler state hash mismatch after push" >&2
                exit 1
              fi
              python - <<'PY'
          import json
          import subprocess

          raw = json.loads(
              subprocess.check_output(
                  ["git", "show", "origin/main:data/timeframe_scan_state.json"],
                  text=True,
              )
          )
          symbols = raw.get("symbols") if isinstance(raw, dict) else None
          if raw.get("version") != 2 or not isinstance(symbols, dict):
              raise SystemExit("[PERSISTENCE] remote scheduler state invalid after push")
          print(f"[PERSISTENCE] remote scheduler state verified symbols={len(symbols)}")
          PY
              echo "[COMMIT_STATE] State pushed and verified successfully"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep $((attempt * 3))
            fi
          done

          echo "[COMMIT_STATE] ERROR: failed to push persistent runtime state after $max_attempts attempts" >&2
          exit 1
