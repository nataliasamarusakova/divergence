name: Event Driven Divergence Monitor

on:
  # The engine cadence is owned by an external scheduler site that fires
  # repository_dispatch (audit finding B6 re-classified as by-design:
  # no in-repo cron schedule is wanted).
  repository_dispatch:
    types: [run_event_engine]

permissions:
  contents: write

concurrency:
  group: divergence-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COINALYZE_URL: ${{ secrets.COINALYZE_URL }}
      COINALYZE_P_SID: ${{ secrets.COINALYZE_P_SID }}
      COINALYZE_CHAT_SID: ${{ secrets.COINALYZE_CHAT_SID }}
      BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
      BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
      BINGX_ENV: vst
      BINGX_BASE_URL: https://open-api-vst.bingx.com
      BINGX_MARGIN_USDT: "1"
      BINGX_LEVERAGE: "10"
      BINGX_MAX_LEVERAGE: "10"
      BINGX_POSITION_MODE: HEDGE
      EXECUTION_ENABLED: "true"
      EXECUTION_MODE: vst
      REQUIRE_CVD_CONFIRMATION: "false"
      REQUIRE_15M_TRIGGER: "true"
      MAX_TRIGGER_DELAY_MIN: "60"
      MAX_EVENT_AGE_MIN: "90"
      SQUEEZE_RELEASE_LOOKBACK_BARS: "4"
      MIN_SETUP_SCORE: "60"
      MAX_TRADES_PER_CYCLE: "3"
      MIN_VOLUME_24H: "25000000"
      MIN_OPEN_INTEREST: "10000000"
      MAX_CANDIDATES: "0"
      KLINE_LIMIT_1H: "250"
      KLINE_LIMIT_15M: "250"
      KLINE_LIMIT_4H: "250"
      # Reconciliation must fail fast; deferred checks are retried next cycle.
      RECONCILIATION_HTTP_TIMEOUT_SEC: "5"
      RECONCILIATION_MAX_SECONDS: "45"
      BINGX_HTTP_TIMEOUT_SEC: "10"
      # Audit fix B3: forced-liquidation squeeze thresholds.
      LIQ_SQUEEZE_MIN_LIQ_OI_RATIO: "0.01"
      LIQ_SQUEEZE_MIN_OI_CHG4H_PCT: "1.5"
      LIQ_SQUEEZE_FUNDING_EXTREME: "0.03"
      LIQ_SQUEEZE_PRICE_SPIKE_ATR: "1.0"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browser binaries
        id: cache-playwright-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Syntax check
        run: |
          python -m compileall -q event_engine run_once.py

      - name: Clean Python cache
        run: |
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run engine
        run: |
          python run_once.py

      - name: Commit state
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git status --short
          git add data/*.jsonl data/*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "event engine snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin main

            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "event engine snapshot-extra $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              fi
            fi

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "State pushed successfully"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep $((attempt * 3))
            fi
          done

          exit 1
