```yaml
name: Recover Coinalyze URL

on:
  workflow_dispatch:

permissions: {}

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Send COINALYZE_URL to Telegram
        env:
          COINALYZE_URL: ${{ secrets.COINALYZE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}

        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          url = os.environ.get("COINALYZE_URL", "").strip()
          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          raw_ids = os.environ.get("TG_CHAT_IDS", "").strip()

          if not url:
              raise SystemExit("ERROR: COINALYZE_URL secret is empty")

          if not token:
              raise SystemExit("ERROR: TG_BOT_TOKEN is missing")

          if not raw_ids:
              raise SystemExit("ERROR: TG_CHAT_IDS is missing")

          try:
              parsed = json.loads(raw_ids)
              if isinstance(parsed, list):
                  chat_ids = parsed
              elif isinstance(parsed, (str, int)):
                  chat_ids = [parsed]
              else:
                  raise ValueError("Unsupported chat ID format")
          except json.JSONDecodeError:
              chat_ids = re.split(r"[,;\s]+", raw_ids)

          chat_ids = [
              str(chat_id).strip()
              for chat_id in chat_ids
              if str(chat_id).strip()
          ]

          if not chat_ids:
              raise SystemExit("ERROR: No valid Telegram chat IDs")

          text = f"Your saved COINALYZE_URL:\n\n{url}"

          sent = 0

          for chat_id in chat_ids:
              payload = urlencode({
                  "chat_id": chat_id,
                  "text": text,
              }).encode("utf-8")

              request = Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  method="POST",
              )

              try:
                  with urlopen(request, timeout=15) as response:
                      result = json.loads(response.read().decode("utf-8"))

                  if not result.get("ok"):
                      raise RuntimeError("Telegram API returned failure")

                  sent += 1

              except Exception:
                  raise SystemExit(
                      "ERROR: Telegram delivery failed; details suppressed"
                  ) from None

          print(f"SUCCESS: URL sent to {sent} Telegram chat(s)")
          PY
```
